<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="lf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="lf-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#lf-bg)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Subtle circuit grid accents -->
  <line x1="8" y1="20" x2="18" y2="20" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="8" cy="20" r="3" fill="#38bdf8"/>

  <line x1="8" y1="44" x2="18" y2="44" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="8" cy="44" r="3" fill="#38bdf8"/>

  <!-- Logic Gate Body (AND/OR hybrid elegant flow) -->
  <path d="M 18 14 C 28 14, 46 22, 48 32 C 46 42, 28 50, 18 50 C 23 40, 23 24, 18 14 Z" 
        fill="#0369a1" 
        fill-opacity="0.25"
        stroke="url(#lf-glow)" 
        stroke-width="3" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Output line & active energy node -->
  <line x1="48" y1="32" x2="56" y2="32" stroke="url(#lf-glow)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="56" cy="32" r="3.5" fill="#38bdf8" filter="url(#glow)"/>
</svg>
